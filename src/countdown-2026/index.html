<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Countdown to 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
            color: #fff;
            position: relative;
        }

        #background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-image: url('background.png');
            z-index: -1;
            transition: opacity 0.5s ease;
        }

        #background.fade {
            animation: fadeEffect 1s ease-in-out;
        }

        #container {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            height: 100vh;
            position: relative;
            z-index: 1;
            padding: 40px;
        }

        #countdown {
            display: flex;
            gap: 50px;
            flex-wrap: wrap;
            justify-content: flex-start;
            background: rgba(0, 0, 0, 0.4);
            padding: 40px 60px;
            border-radius: 25px;
            backdrop-filter: blur(12px);
            transition: opacity 0.5s ease;
        }

        #countdown.fade {
            animation: fadeEffect 1s ease-in-out;
        }

        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-value {
            font-size: 130px;
            font-weight: bold;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.9),
                         0 0 50px rgba(255, 215, 0, 0.6),
                         3px 3px 8px rgba(0, 0, 0, 0.9);
            line-height: 1;
            min-width: 180px;
            color: #FFD700;
        }

        .time-label {
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 12px;
            opacity: 0.98;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
        }

        #title {
            display: none;
        }

        #bigNumber {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 300px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 0 0 50px rgba(255, 255, 255, 1),
                         0 0 100px rgba(255, 215, 0, 0.8),
                         5px 5px 15px rgba(0, 0, 0, 0.9);
            z-index: 200;
        }

        #bigNumber.animate {
            animation: zoomInOut 1s ease-out;
        }

        @keyframes zoomInOut {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        @keyframes fadeEffect {
            0% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
            100% {
                opacity: 1;
            }
        }

        #welcome {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.9),
                         2px 2px 6px rgba(0, 0, 0, 0.8);
            animation: pulse 2s infinite;
            background: rgba(0, 0, 0, 0.4);
            padding: 40px 60px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            color: #FFD700;
            z-index: 100;
            text-align: center;
        }

        @keyframes pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.05);
                opacity: 0.9;
            }
        }

        .firework {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            #container {
                padding: 20px;
            }
            #countdown {
                gap: 20px;
                padding: 25px 30px;
            }
            .time-value {
                font-size: 56px;
                min-width: 90px;
            }
            .time-label {
                font-size: 14px;
                margin-top: 8px;
            }
            #bigNumber {
                font-size: 150px;
            }
            #welcome {
                font-size: 48px;
                padding: 30px 20px;
                max-width: 90%;
            }
        }

        @media (max-width: 480px) {
            #container {
                padding: 15px;
            }
            #countdown {
                gap: 15px;
                padding: 20px;
                flex-direction: column;
            }
            .time-value {
                font-size: 48px;
                min-width: 80px;
            }
            .time-label {
                font-size: 12px;
            }
            #bigNumber {
                font-size: 120px;
            }
            #welcome {
                font-size: 36px;
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <div id="background"></div>

    <div id="audioPrompt" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); padding: 30px 50px; border-radius: 20px; color: #FFD700; font-size: 24px; z-index: 300; text-align: center; cursor: pointer; backdrop-filter: blur(10px);">
        Click anywhere to enable sound 🔊
    </div>

    <div id="container">
        <div id="bigNumber"></div>

        <div id="countdown">
            <div class="time-unit">
                <div class="time-value" id="days">00</div>
                <div class="time-label">Days</div>
            </div>
            <div class="time-unit">
                <div class="time-value" id="hours">00</div>
                <div class="time-label">Hours</div>
            </div>
            <div class="time-unit">
                <div class="time-value" id="minutes">00</div>
                <div class="time-label">Minutes</div>
            </div>
            <div class="time-unit">
                <div class="time-value" id="seconds">00</div>
                <div class="time-label">Seconds</div>
            </div>
        </div>

        <div id="welcome">Welcome to 2026!</div>
    </div>

    <script>
        // Audio context for sounds
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioContext = new AudioContext();

        // Function to play tick sound
        function playTick() {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = 800;
            oscillator.type = 'sine';

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.1);
        }

        // Function to play exciting countdown sound (last 10 seconds)
        function playExcitingTick(number) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            // Frequency increases as we get closer to 0
            oscillator.frequency.value = 600 + (10 - number) * 100;
            oscillator.type = 'triangle';

            gainNode.gain.setValueAtTime(0.5, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);

            // Add a second harmonic for richness
            const oscillator2 = audioContext.createOscillator();
            const gainNode2 = audioContext.createGain();

            oscillator2.connect(gainNode2);
            gainNode2.connect(audioContext.destination);

            oscillator2.frequency.value = (600 + (10 - number) * 100) * 1.5;
            oscillator2.type = 'sine';

            gainNode2.gain.setValueAtTime(0.2, audioContext.currentTime);
            gainNode2.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);

            oscillator2.start(audioContext.currentTime);
            oscillator2.stop(audioContext.currentTime + 0.2);
        }

        // Function to play celebration sound
        function playCelebration() {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.setValueAtTime(440, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(880, audioContext.currentTime + 0.5);
            oscillator.type = 'triangle';

            gainNode.gain.setValueAtTime(0.5, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.8);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.8);
        }

        // Fireworks animation
        function createFirework(x, y) {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ffffff', '#ffa500'];
            const particles = 50;

            for (let i = 0; i < particles; i++) {
                const firework = document.createElement('div');
                firework.className = 'firework';
                firework.style.left = x + 'px';
                firework.style.top = y + 'px';
                firework.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

                document.body.appendChild(firework);

                const angle = (Math.PI * 2 * i) / particles;
                const velocity = 2 + Math.random() * 3;
                const vx = Math.cos(angle) * velocity;
                const vy = Math.sin(angle) * velocity;

                let posX = x;
                let posY = y;
                let opacity = 1;

                const animate = () => {
                    posX += vx;
                    posY += vy;
                    opacity -= 0.015;

                    firework.style.left = posX + 'px';
                    firework.style.top = posY + 'px';
                    firework.style.opacity = opacity;

                    if (opacity > 0) {
                        requestAnimationFrame(animate);
                    } else {
                        firework.remove();
                    }
                };

                animate();
            }
        }

        function launchFireworks() {
            const interval = setInterval(() => {
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight * 0.7;
                createFirework(x, y);
            }, 300);

            setTimeout(() => clearInterval(interval), 10000);
        }

        // Countdown logic
        // Testing: 15 seconds from now
        const targetDate = new Date().getTime() + (15 * 1000);
        // Production: const targetDate = new Date('2026-01-01T00:00:00').getTime();
        let hasReachedZero = false;
        let lastSecond = -1;

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                if (!hasReachedZero) {
                    hasReachedZero = true;

                    // Hide countdown, show welcome message
                    document.getElementById('countdown').style.display = 'none';
                    document.getElementById('welcome').style.display = 'block';

                    // Play celebration sound
                    playCelebration();

                    // Launch fireworks
                    launchFireworks();
                }
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

            // Play tick sound during last minute
            const totalSeconds = days * 86400 + hours * 3600 + minutes * 60 + seconds;

            // Only trigger on second change
            if (seconds !== lastSecond) {
                lastSecond = seconds;

                // Show big number in last 10 seconds
                if (totalSeconds <= 10 && totalSeconds > 0) {
                    const bigNumber = document.getElementById('bigNumber');
                    bigNumber.textContent = totalSeconds;

                    // Remove animation class first
                    bigNumber.classList.remove('animate');
                    bigNumber.style.display = 'none';

                    // Force reflow
                    void bigNumber.offsetWidth;

                    // Show and add animation class
                    bigNumber.style.display = 'block';
                    bigNumber.classList.add('animate');

                    // Hide after animation (keep a bit longer to complete animation)
                    setTimeout(() => {
                        bigNumber.style.display = 'none';
                        bigNumber.classList.remove('animate');
                    }, 1000);

                    // Fade effect on background and countdown
                    const background = document.getElementById('background');
                    const countdown = document.getElementById('countdown');

                    background.classList.remove('fade');
                    countdown.classList.remove('fade');
                    void background.offsetWidth; // Force reflow

                    background.classList.add('fade');
                    countdown.classList.add('fade');

                    // Play exciting sound for last 10 seconds
                    playExcitingTick(totalSeconds);
                } else if (totalSeconds <= 60) {
                    // Play normal tick sound for seconds 11-60
                    playTick();
                }
            }
        }

        // Update countdown every 100ms for smooth updates
        setInterval(updateCountdown, 100);
        updateCountdown();

        // Resume audio context on user interaction (required by browsers)
        let audioReady = false;
        const audioPrompt = document.getElementById('audioPrompt');

        async function enableAudio() {
            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }
            audioReady = true;
            if (audioPrompt) {
                audioPrompt.style.display = 'none';
            }
            console.log('Audio context ready!');

            // Play a test sound
            playTick();
        }

        document.addEventListener('click', enableAudio);
        document.addEventListener('touchstart', enableAudio);
    </script>
</body>
</html>
